name: semantic_release

# Releases are independent of the tox matrix in push-main.yml so a flaky or
# unsupported-interpreter test job can no longer block a release (the last two
# main pushes were skipped that way). Mirrors alandtse/alexa_media_player.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Debounce: when several PRs land close together, release once for the whole batch.
  # Each push-triggered run first sleeps here; a newer push cancels the sleeping run, so
  # only the last push of a burst reaches the release job, which releases every
  # unreleased commit. Manual dispatches skip the wait, and so does PSR's own release
  # commit (it would only trigger a no-op run). The release itself runs in a separate,
  # non-cancelling concurrency group so an in-flight release is never interrupted.
  debounce:
    name: Debounce
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    runs-on: ubuntu-latest
    concurrency:
      group: release-debounce
      cancel-in-progress: true
    steps:
      - name: Wait for further pushes
        run: sleep 300

  release:
    needs: debounce
    # A skipped debounce (manual dispatch, release commit) must not skip the release; a
    # cancelled or failed one must.
    if: ${{ !cancelled() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: semantic_release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Git
        run: |
          git config --global user.name "semantic-release"
          git config --global user.email "semantic-release@GitHub"
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          commit: true
          push: true
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          password: ${{ secrets.PYPI_TOKEN }}
